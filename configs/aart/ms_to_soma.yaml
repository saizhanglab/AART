# GNPC: MS → SomaScan imputation
# Annotation: built from MS feature metadata (gene_name column)
paths:
  data_dir: data/GNPC_MS_SomaScan
  source_input: ms_overlap.csv
  source_target: somascan_overlap.csv
  train_soma: data/GNPC_MS_SomaScan/ms_overlap_train.csv
  test_soma: data/GNPC_MS_SomaScan/ms_overlap_test.csv
  train_olink: data/GNPC_MS_SomaScan/somascan_overlap_train.csv
  test_olink: data/GNPC_MS_SomaScan/somascan_overlap_test.csv
  annotation: data/GNPC_MS_SomaScan/ms_annotation_cache.csv
annotation:
  source: feature_metadata
  file: ms_feature_metadata.csv
split:
  id_column: sample_id
  random_state: 42
  test_size: 0.2
  val_size: 0.1
baseline_grid:
  anchor_alpha_single: [0.01, 0.1, 1.0]
  anchor_alpha_multi: [0.1, 1.0, 10.0]
  residual_alpha: [10.0, 30.0, 100.0, 300.0]
  n_components: [64, 128, 256]
  gate_lambda: [0.1, 1.0, 10.0]
